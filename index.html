<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Иммануил Кант — Границы разума и нравственный закон</title>
    <script>
      (function () {
        function showBootError(msg) {
          var el = document.getElementById('boot-status');
          if (el) {
            el.style.color = '#d9848a';
            el.textContent = 'Ошибка: ' + msg;
          }
        }
        window.addEventListener('error', function (e) {
          showBootError((e && e.message) ? e.message : 'ошибка загрузки скрипта');
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          showBootError(r && r.message ? r.message : String(r || 'promise rejection'));
        });
      })();
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0B0B0A;
        color: #EAE4D8;
        font-family: Georgia, serif;
      }
      #boot-fallback {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px;
        background: #0B0B0A;
        color: #EAE4D8;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback">
        <div style="font-size: 14px; letter-spacing: 0.25em; color: #B79B68; margin-bottom: 14px;">1724 — 1804</div>
        <div style="font-size: 38px; letter-spacing: 0.08em; font-weight: 300;">ИММАНУИЛ КАНТ</div>
        <div id="boot-status" style="margin-top: 18px; font-family: sans-serif; font-size: 13px; color: #8c867c;">Загрузка презентации…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
